version: 1
frontend:
  phases:
    preBuild:
      commands:
        - echo "Nothing to build"
    build:
      commands:
        - echo "Nothing to build"
  artifacts:
    baseDirectory: /
    files:
      - '**/*'
  cache:
    paths: []
  customHeaders:
    - pattern: '**/*'
      headers:
        - key: 'X-Frame-Options'
          value: 'ALLOWALL'
        - key: 'Content-Security-Policy'
          value: "frame-ancestors 'self' https://www.figma.com"
